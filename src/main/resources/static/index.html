<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Readability</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #fafafa;
            color: #1a1a1a;
            min-height: 100vh;
            padding: 3rem 1.5rem;
        }

        .container {
            max-width: 640px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 500;
            letter-spacing: -0.02em;
        }

        .nav-link {
            font-size: 0.85rem;
            color: #666;
            text-decoration: none;
            cursor: pointer;
            transition: color 0.2s;
        }

        .nav-link:hover {
            color: #1a1a1a;
        }

        textarea {
            width: 100%;
            height: 180px;
            padding: 1rem;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.95rem;
            line-height: 1.6;
            resize: vertical;
            background: #fff;
            transition: border-color 0.2s;
        }

        textarea:focus {
            outline: none;
            border-color: #1a1a1a;
        }

        textarea::placeholder {
            color: #999;
        }

        button {
            margin-top: 1rem;
            padding: 0.75rem 1.5rem;
            background: #1a1a1a;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #333;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .results {
            margin-top: 2.5rem;
            display: none;
        }

        .results.visible {
            display: block;
        }

        .summary {
            padding: 1.5rem;
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            margin-bottom: 1.5rem;
        }

        .age {
            font-size: 2.5rem;
            font-weight: 600;
            letter-spacing: -0.03em;
        }

        .age-label {
            font-size: 0.85rem;
            color: #666;
            margin-top: 0.25rem;
        }

        .scores {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }

        .score-card {
            padding: 1rem;
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
        }

        .score-name {
            font-size: 0.75rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }

        .score-value {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .score-age {
            font-size: 0.8rem;
            color: #666;
            margin-top: 0.25rem;
        }

        .counts {
            margin-top: 1.5rem;
            padding: 1rem;
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
        }

        .count-item {
            text-align: center;
        }

        .count-value {
            font-size: 1.25rem;
            font-weight: 600;
        }

        .count-label {
            font-size: 0.7rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-top: 0.25rem;
        }

        .error {
            margin-top: 1rem;
            padding: 1rem;
            background: #fff5f5;
            border: 1px solid #ffcccc;
            border-radius: 8px;
            color: #cc0000;
            font-size: 0.9rem;
            display: none;
        }

        .error.visible {
            display: block;
        }

        /* History styles */
        .history-view {
            display: none;
        }

        .history-view.visible {
            display: block;
        }

        .analyze-view.hidden {
            display: none;
        }

        .history-empty {
            text-align: center;
            color: #666;
            padding: 3rem 1rem;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .history-item {
            padding: 1rem;
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .history-item:hover {
            border-color: #1a1a1a;
        }

        .history-text {
            font-size: 0.9rem;
            color: #333;
            margin-bottom: 0.75rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .history-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: #666;
        }

        .history-age {
            font-weight: 600;
            color: #1a1a1a;
        }

        .history-date {
            font-size: 0.75rem;
        }

        @media (max-width: 480px) {
            .scores {
                grid-template-columns: 1fr;
            }
            
            .counts {
                justify-content: space-between;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Readability</h1>
            <a class="nav-link" id="navToggle" onclick="toggleView()">History</a>
        </header>

        <!-- Analyze View -->
        <div class="analyze-view" id="analyzeView">
            <textarea id="text" placeholder="Paste your text here..."></textarea>
            <button id="analyze" onclick="analyze()">Analyze</button>
            
            <div class="error" id="error"></div>
            
            <div class="results" id="results">
                <div class="summary">
                    <div class="age" id="avgAge">-</div>
                    <div class="age-label">average reading age</div>
                </div>
                
                <div class="scores" id="scores"></div>
                
                <div class="counts" id="counts"></div>
            </div>
        </div>

        <!-- History View -->
        <div class="history-view" id="historyView">
            <div class="history-list" id="historyList"></div>
        </div>
    </div>

    <script>
        const scoreNames = {
            'ARI': 'Automated Readability Index',
            'FK': 'Flesch-Kincaid',
            'SMOG': 'SMOG Index',
            'CL': 'Coleman-Liau'
        };

        let showingHistory = false;
        let historyItems = [];

        async function analyze() {
            const text = document.getElementById('text').value.trim();
            const btn = document.getElementById('analyze');
            const error = document.getElementById('error');
            const results = document.getElementById('results');

            error.classList.remove('visible');
            
            if (!text) {
                showError('Please enter some text to analyze.');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Analyzing...';

            try {
                const response = await fetch('/api/readability', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text })
                });

                if (!response.ok) {
                    throw new Error('Analysis failed');
                }

                const data = await response.json();
                displayResults(data);
                results.classList.add('visible');
            } catch (err) {
                showError('Something went wrong. Please try again.');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Analyze';
            }
        }

        function displayResults(data) {
            document.getElementById('avgAge').textContent = Math.round(data.averageAge);

            const scoresEl = document.getElementById('scores');
            scoresEl.innerHTML = '';
            
            for (const [key, detail] of Object.entries(data.scores)) {
                scoresEl.innerHTML += `
                    <div class="score-card">
                        <div class="score-name">${scoreNames[key] || key}</div>
                        <div class="score-value">${detail.score.toFixed(1)}</div>
                        <div class="score-age">Age ${detail.age}</div>
                    </div>
                `;
            }

            const countsEl = document.getElementById('counts');
            const c = data.counts;
            countsEl.innerHTML = `
                <div class="count-item">
                    <div class="count-value">${c.words}</div>
                    <div class="count-label">Words</div>
                </div>
                <div class="count-item">
                    <div class="count-value">${c.sentences}</div>
                    <div class="count-label">Sentences</div>
                </div>
                <div class="count-item">
                    <div class="count-value">${c.characters}</div>
                    <div class="count-label">Characters</div>
                </div>
                <div class="count-item">
                    <div class="count-value">${c.syllables}</div>
                    <div class="count-label">Syllables</div>
                </div>
                <div class="count-item">
                    <div class="count-value">${c.polysyllables}</div>
                    <div class="count-label">Polysyllables</div>
                </div>
            `;
        }

        function showError(msg) {
            const error = document.getElementById('error');
            error.textContent = msg;
            error.classList.add('visible');
        }

        async function toggleView() {
            showingHistory = !showingHistory;
            const navToggle = document.getElementById('navToggle');
            const analyzeView = document.getElementById('analyzeView');
            const historyView = document.getElementById('historyView');

            if (showingHistory) {
                navToggle.textContent = 'Analyze';
                analyzeView.classList.add('hidden');
                historyView.classList.add('visible');
                await loadHistory();
            } else {
                navToggle.textContent = 'History';
                analyzeView.classList.remove('hidden');
                historyView.classList.remove('visible');
            }
        }

        async function loadHistory() {
            const historyList = document.getElementById('historyList');
            historyList.innerHTML = '<div class="history-empty">Loading...</div>';

            try {
                const response = await fetch('/api/readability/history');
                const data = await response.json();

                if (!data.results || data.results.length === 0) {
                    historyList.innerHTML = '<div class="history-empty">No history yet. Analyze some text to get started.</div>';
                    return;
                }

                historyItems = data.results;
                historyList.innerHTML = data.results.map((item, index) => `
                    <div class="history-item" data-index="${index}">
                        <div class="history-text">${escapeHtml(item.text)}</div>
                        <div class="history-meta">
                            <span class="history-age">Age ${Math.round(item.averageAge)}</span>
                            <span class="history-date">${formatDate(item.createdAt)}</span>
                        </div>
                    </div>
                `).join('');

                historyList.querySelectorAll('.history-item').forEach(el => {
                    el.addEventListener('click', () => {
                        const index = parseInt(el.dataset.index, 10);
                        showHistoryItem(historyItems[index]);
                    });
                });
            } catch (err) {
                historyList.innerHTML = '<div class="history-empty">Failed to load history.</div>';
            }
        }

        function showHistoryItem(item) {
            showingHistory = false;
            document.getElementById('navToggle').textContent = 'History';
            document.getElementById('analyzeView').classList.remove('hidden');
            document.getElementById('historyView').classList.remove('visible');
            
            document.getElementById('text').value = item.text;
            displayResults(item);
            document.getElementById('results').classList.add('visible');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleDateString(undefined, { 
                month: 'short', 
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        document.getElementById('text').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && e.ctrlKey) {
                analyze();
            }
        });
    </script>
</body>
</html>
